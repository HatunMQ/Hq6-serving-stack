# The pod from yesterday, wrapped in the thing that keeps it alive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never take a ready pod away before its replacement is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: hatun0/aidc-serving:cpu-v1
          ports:
            - containerPort: 8000
          lifecycle:
            preStop:              # keep serving while endpoint removal propagates;
              sleep:              # without this, a rolling update drops the requests
                seconds: 5        # that land in that race window (measured: 2 in 45s)
          env:
            - name: MODEL_BACKEND
              value: "echo"
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: APP_VERSION        # an env var; changing it is one way to trigger a roll (the verifier flips VERIFY_STAMP)
              value: "v1"
          readinessProbe:            # "may traffic come here?" keeps traffic off a pod that isn't ready yet
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:             # "should this pod be restarted?" generous delay so a slow load isn't mistaken for dead
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
