apiVersion: v1
kind: Pod
metadata:
  name: serving
  labels:
    app: serving
spec:
  containers:
    - name: serving
      image: ghalaalnasser/aidc-serving:cpu-v2
      ports:
        - containerPort: 8000
      env:
        - name: MODEL_BACKEND
          value: "echo"
        - name: MODEL_ID
          value: "Qwen/Qwen2.5-0.5B-Instruct"
